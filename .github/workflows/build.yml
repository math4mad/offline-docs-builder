name: Build macOS Offline Docs

on:
  workflow_dispatch:
    inputs:
      library:
        description: Library name from libraries.yaml
        required: true
        type: string
      version:
        description: Library version to package
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install documentation tools
        run: brew install graphviz imagemagick librsvg

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --global @neutralinojs/neu

      - name: Read library configuration
        id: library
        env:
          LIBRARY: ${{ inputs.library }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          import yaml

          library_name = os.environ["LIBRARY"]
          with open("libraries.yaml", encoding="utf-8") as config_file:
              libraries = yaml.safe_load(config_file)["libraries"]
          library = next(
              (item for item in libraries if item["name"].lower() == library_name.lower()),
              None,
          )
          if library is None:
              raise SystemExit(f"Library not found: {library_name}")
          print(f"name={library['name']}")
          print(f"strategy={library['doc_source']}")
          print(f"repo={library['repo']}")
          print(f"doc_url={library['doc_url']}")
          PY

      - name: Download documentation
        continue-on-error: true
        env:
          LIBRARY: ${{ steps.library.outputs.name }}
          VERSION: ${{ inputs.version }}
          STRATEGY: ${{ steps.library.outputs.strategy }}
          REPO: ${{ steps.library.outputs.repo }}
          DOC_URL: ${{ steps.library.outputs.doc_url }}
        run: bash scripts/download-docs.sh "$LIBRARY" "$VERSION" "$STRATEGY" "$REPO" "$DOC_URL"

      - name: Ensure documentation entry page
        run: |
          mkdir -p resources
          if [[ ! -f resources/index.html ]]; then
            cp templates/index.html resources/index.html
            echo "Documentation was unavailable; using the fallback entry page."
          fi

      - name: Build macOS application
        env:
          LIBRARY: ${{ steps.library.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: python scripts/build_neutralino.py "$LIBRARY" "$VERSION" resources artifacts

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.library.outputs.name }}-macos-v${{ inputs.version }}
          path: artifacts/
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LIBRARY: ${{ steps.library.outputs.name }}
          VERSION: ${{ inputs.version }}
        run: |
          tag="${LIBRARY}-v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "$tag" artifacts/* \
            --title "${LIBRARY} Offline Docs v${VERSION}" \
            --notes "macOS offline documentation build for ${LIBRARY} v${VERSION}."
